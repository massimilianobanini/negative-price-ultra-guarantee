name: Sync Substack public archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"  # UTC; every 3 hours, avoiding the busy top of the hour.
  push:
    paths:
      - ".github/workflows/sync-substack-sitemap.yml"
      - "scripts/sync_substack.py"
      - "tests/test_sync_substack.py"

permissions:
  contents: write

concurrency:
  group: sync-substack-articles
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public documentation repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check sync script behavior
        run: python3 -m unittest discover -s tests -p 'test_sync_substack.py' -v

      - name: Download public Substack sitemap archive
        run: |
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/massimilianobanini/theminusoneguarantee-sitemap/main/articles.json" \
            --output "$RUNNER_TEMP/substack-archive.json"

      - name: Reconcile verified and provisional records
        run: python3 scripts/sync_substack.py --source "$RUNNER_TEMP/substack-archive.json"

      - name: Commit only if the two catalog files changed
        run: |
          if git diff --quiet -- fonti/substack-articles.json fonti/substack-articoli.md; then
            echo "Already synchronized; no commit necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- fonti/substack-articles.json fonti/substack-articoli.md
          git commit -m "Sync new Substack articles from public sitemap [automated]"
          git push origin HEAD:main
